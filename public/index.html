<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><link rel="icon" type="image/png" sizes="48x48" href="/icons/icon-user-48.png"><link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-user-192.png"><link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-user-180.png"><link rel="manifest" href="/icons/user.webmanifest"><meta name="theme-color" content="#1f6b54"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="21天课程"><title>21天健康营养课</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&display=swap">
<style>
/* ===== src/app/css/1-base.css ===== */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
/* Layout: one phone-width column — progress header, 3×7 calendar of days, then the day's lesson card with charts and class slides */
:root{
  --bg:#eef3f0; --surface:#ffffff; --ink:#15302a; --muted:#5b6f69; --line:#d3dfda;
  --leaf:#1f6b54; --leaf-soft:#dcebe4; --sun:#e8892b; --sun-soft:#fbe9d6; --lock:#c3cfca;
  --bad:#c4473a; --bad-soft:#f8e1dd; --mid:#e3b23c; --water:#2f86c0; --water-soft:#dcecf7; --tissue:#e39b93;
  --display:"Noto Serif SC","Songti SC","STSong",serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1a17; --surface:#16241f; --ink:#e3eee9; --muted:#9db1aa; --line:#2a3d36;
  --leaf:#6cc2a2; --leaf-soft:#1d3a30; --sun:#f0a35a; --sun-soft:#3a2a1a; --lock:#3a4b45;
  --bad:#ef8a7c; --bad-soft:#3d2320; --mid:#e8c160; --water:#6db5e6; --water-soft:#1b3242; --tissue:#c47d76; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a17; --surface:#16241f; --ink:#e3eee9; --muted:#9db1aa; --line:#2a3d36;
  --leaf:#6cc2a2; --leaf-soft:#1d3a30; --sun:#f0a35a; --sun-soft:#3a2a1a; --lock:#3a4b45;
  --bad:#ef8a7c; --bad-soft:#3d2320; --mid:#e8c160; --water:#6db5e6; --water-soft:#1b3242; --tissue:#c47d76; color-scheme:dark}
*{box-sizing:border-box} [hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75}
.wrap{max-width:680px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.3}
p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--leaf);font-weight:700}
header{display:flex;flex-direction:column;gap:10px}
header h1{font-size:clamp(28px,7vw,40px);font-weight:900}
header p{color:var(--muted)}
.prog{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.prog-num{font-family:var(--display);font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.prog-num small{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted)}
.bar{flex:1;min-width:160px;display:grid;grid-template-columns:repeat(21,1fr);gap:3px}
.bar i{height:8px;border-radius:2px;background:var(--line)}
.bar i.on{background:var(--leaf)}
.status{background:var(--sun-soft);border-radius:10px;padding:10px 14px;font-size:14px}
.status b{font-variant-numeric:tabular-nums;color:var(--sun)}
.cal{display:flex;flex-direction:column;gap:10px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week-label{font-size:12px;color:var(--muted);letter-spacing:.08em;display:flex;justify-content:space-between;gap:8px}
.tile{aspect-ratio:1;max-width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
.tile .n{font-family:var(--display);font-weight:900;font-size:clamp(15px,4.4vw,20px);line-height:1}
.tile .s{font-size:10px;color:var(--muted);line-height:1.5;display:flex;align-items:center;height:15px}
.tile .s svg{width:11px;height:11px}
.tile.done{background:var(--leaf);border-color:var(--leaf);color:var(--surface)}
.tile.done .s{color:var(--surface);opacity:.85}
.tile.today{border-color:var(--sun);border-width:2.5px;background:var(--sun-soft)}
.tile.today .s{color:var(--sun);font-weight:700}
.tile.locked{background:transparent;border-style:dashed;color:var(--lock);cursor:not-allowed}
.tile.locked .s{color:var(--lock)}
.tile.preview{cursor:pointer;color:var(--muted)}
.tile.sel{outline:3px solid var(--ink);outline-offset:2px}
.tile:focus-visible{outline:3px solid var(--sun);outline-offset:2px}


/* ===== src/app/css/2-lesson.css ===== */
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px clamp(16px,5vw,32px) 28px;display:flex;flex-direction:column;gap:22px;min-width:0}
.lesson-head{display:flex;flex-direction:column;gap:6px}
.daytag{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.daytag .d{font-family:var(--display);font-weight:900;color:var(--sun);font-size:15px}
.chip{background:var(--leaf-soft);color:var(--leaf);border-radius:99px;padding:1px 10px;font-size:12px;font-weight:700}
.lesson h2{font-size:clamp(24px,6vw,32px);font-weight:900}
.lesson .en{color:var(--muted);font-size:13px}
.lead{font-size:18px;font-weight:700;font-family:var(--display);line-height:1.55}
.intro{color:var(--ink)}
.sec{display:flex;flex-direction:column;gap:12px}
.sec h3{font-size:18px;font-weight:900;display:flex;align-items:center;gap:8px}
.sec h3::before{content:"";width:4px;height:1em;background:var(--sun);border-radius:2px}
.points{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px;counter-reset:pt}
.points>li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;counter-increment:pt}
.points>li::before{content:counter(pt);width:26px;height:26px;border-radius:50%;background:var(--leaf-soft);color:var(--leaf);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:2px}
.points>li>div>b{display:block;font-size:16px}
.points>li>div>span{color:var(--muted);font-size:15px}


.hook{background:var(--leaf);color:var(--surface);border-radius:14px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px}
.hook .eyebrow{color:var(--surface);opacity:.85}
.hook .q{font-family:var(--display);font-weight:900;font-size:clamp(18px,4.8vw,21px);line-height:1.5}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;font-size:15px;text-align:left;background:var(--surface);color:var(--ink);border:2px solid transparent;border-radius:10px;padding:10px 14px;cursor:pointer;display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start}
.opt i{font-style:normal;font-weight:700;color:var(--leaf)}
.opt:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--sun);background:var(--sun-soft)}
.opt.right span::after{content:" ✓";color:var(--sun);font-weight:700}
.opt.wrong{opacity:.6;text-decoration:line-through}
.answer{background:var(--surface);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:15px}
.answer b{color:var(--sun)}
.hook-hint{font-size:13px;opacity:.85}
.pfigs{display:grid;gap:8px;margin-top:10px}
.pfigs.n2{grid-template-columns:1fr 1fr} .pfigs.n3{grid-template-columns:1fr 1fr 1fr}
.pfig{margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.pfig button{padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;cursor:zoom-in;display:block;width:100%}
.pfig img{display:block;width:100%;height:auto;max-width:100%}
.fg{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.fg-grp{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.fg-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:8px 12px;color:#fff}
.fg-h b{font-size:15px} .fg-h span{font-size:12px;opacity:.9;font-variant-numeric:tabular-nums}
.fg-grp.hi .fg-h{background:var(--bad)} .fg-grp.mid .fg-h{background:var(--mid);color:#3a2a00} .fg-grp.lo .fg-h{background:var(--leaf);color:var(--surface)}
.fg-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:10px 8px;padding:12px 10px}
.fg-it{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;text-align:center}
.fg-it img{width:100%;max-width:100%;height:auto;aspect-ratio:1;border-radius:10px;object-fit:cover;display:block}
.fg-n{font-size:13px;line-height:1.3}
.fg-v{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;padding:0 8px;border-radius:99px;color:#fff}
.fg-grp.hi .fg-v{background:var(--bad)} .fg-grp.mid .fg-v{background:var(--mid);color:#3a2a00} .fg-grp.lo .fg-v{background:var(--leaf);color:var(--surface)}
.points .fg-h span{color:inherit;font-size:12px}
.points .fg-n{color:var(--ink);font-size:13px}
.points .fg-v{color:#fff;font-size:12px}
.points .fg-grp.mid .fg-v{color:#3a2a00}
.points .fg-grp.lo .fg-v{color:var(--surface)}
.pviz{margin-top:10px}
.pviz .viz{background:var(--bg)}
.kc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px}
.kc-it{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.kc-it img{width:100%;height:auto;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block;max-width:100%}
.points .kc-n{color:var(--ink);font-size:13px;line-height:1.35}
.points .kc-v,.kc-v{background:var(--sun);color:#fff;font-weight:700;font-size:12px;border-radius:99px;padding:1px 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.points .kc-s{font-size:11px;color:var(--muted)}
.portion{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.portion>div{background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;border-top:5px solid var(--leaf);min-width:0}
.portion>div.pro{border-top-color:var(--sun)}
.portion h4{margin:0;font-size:16px}
.points .portion .kcal{font-family:var(--display);font-weight:900;font-size:26px;color:var(--leaf);line-height:1;font-variant-numeric:tabular-nums}
.points .portion .pro .kcal{color:var(--sun)}
.points .portion .kcal small{font-size:13px;font-family:var(--body);font-weight:700;margin-left:2px}
.points .portion .unit{font-size:12px;color:var(--muted)}
.portion ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.portion li{display:flex;align-items:center;gap:8px;font-size:14px}
.portion li img{width:40px;height:40px;border-radius:8px;object-fit:cover;flex:none}
.portion li i{width:40px;height:40px;border-radius:8px;flex:none;background:var(--leaf-soft);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;color:var(--leaf)}
.portion .pro li i{background:var(--sun-soft);color:var(--sun)}
.points .portion li em{font-style:normal;font-size:11px;color:var(--bad);font-weight:700;display:block;line-height:1.3}
.bodyw{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center}
.bodyw svg{width:110px;height:auto;max-width:100%}
.bodyw ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.bodyw li{display:flex;justify-content:space-between;align-items:baseline;gap:8px;background:var(--surface);border-radius:10px;padding:8px 12px;font-size:14px}
.points .bodyw li b{font-family:var(--display);font-size:22px;color:var(--water);font-variant-numeric:tabular-nums}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo figure{margin:0;background:var(--surface);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.duo svg{width:100%;height:auto;display:block}
.duo figcaption{font-size:13px;text-align:center;font-weight:700}
.duo .ok figcaption{color:var(--leaf)} .duo .no figcaption{color:var(--bad)}
.points .duo p{font-size:12px;color:var(--muted);text-align:center;margin:0}
.sug{background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.sug svg{width:100%;height:auto;display:block}
.points .sug .cap{font-size:13px;font-weight:700}
.sug.no .cap{color:var(--bad)} .sug.ok .cap{color:var(--leaf)}
.flow{display:flex;flex-direction:column;gap:6px}
.flow-step{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;background:var(--surface);border-radius:10px;padding:8px 12px}
.flow-step i{width:30px;height:30px;border-radius:50%;background:var(--leaf);color:var(--surface);font-style:normal;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.points .flow-step b{font-size:15px;display:block} .points .flow-step span{font-size:13px;color:var(--muted)}
.flow-arrow{text-align:center;color:var(--leaf);font-size:16px;line-height:1}
.flow-targets{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.points .flow-targets span{background:var(--leaf-soft);color:var(--leaf);font-weight:700;font-size:13px;border-radius:99px;padding:3px 12px}
.swap{display:flex;flex-direction:column;gap:8px}
.swap-row{display:grid;grid-template-columns:1fr 18px 1fr;align-items:center;gap:4px}
.swap-c{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:10px;padding:6px;min-width:0;min-height:50px}
.swap-c img{width:36px;height:36px;border-radius:8px;object-fit:cover;flex:none}
.swap-c>div{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.points .swap-c span{font-size:13px;color:var(--ink);line-height:1.3;white-space:nowrap}
.swap-c>div{flex:1}
.points .swap-c b{font-size:12px;color:#fff;border-radius:99px;padding:0 8px;font-variant-numeric:tabular-nums}
.swap-c.hi b{background:var(--bad)} .swap-c.lo b{background:var(--leaf);color:var(--surface)} .swap-c.mid b{background:var(--mid);color:#3a2a00}
.swap-ph{width:36px;height:36px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;background:var(--leaf-soft);color:var(--leaf)}
.swap-row>.ar{color:var(--leaf);font-weight:900;text-align:center}
.mwf{display:flex;flex-direction:column;gap:10px}
.mwf-row{display:grid;grid-template-columns:68px 1fr;gap:10px;align-items:center}
.points .mwf-row>span{font-weight:700;font-size:14px;color:var(--ink)}
.mwf-blocks{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap}
.mwf-blocks div{border-radius:8px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;line-height:1.1}
.mwf-blocks small{font-size:10px;font-weight:700}
.mwf-blocks .m{background:var(--leaf)} .mwf-blocks .w{background:var(--water)} .mwf-blocks .f{background:var(--sun)}
.points .mwf-row em{font-style:normal;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;margin-left:4px}
.mwf-row em.ok{background:var(--leaf-soft);color:var(--leaf)} .mwf-row em.no{background:var(--bad-soft);color:var(--bad)}
.nl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:nl}
.nl li{counter-increment:nl;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;background:var(--surface);border-radius:10px;padding:8px 12px;font-size:14px}
.nl li::before{content:counter(nl);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;background:var(--leaf)}
.nl li:nth-child(3n+2)::before{background:var(--sun)} .nl li:nth-child(3n)::before{background:var(--water)}
.bal{display:flex;flex-direction:column;gap:8px}
.bal-row{display:grid;grid-template-columns:1fr 30px 1fr 84px;gap:6px;align-items:center}
.points .bal-row>span{font-size:13px;font-weight:700;text-align:center;border-radius:8px;padding:8px 4px;color:var(--ink)}
.points .bal-row .in{background:var(--sun-soft)} .points .bal-row .out{background:var(--leaf-soft)}
.points .bal-row .op{font-family:var(--display);font-size:22px;font-weight:900;color:var(--ink);background:none;padding:0}
.points .bal-row .res{color:#fff}
.bal-row .res.down{background:var(--leaf)} .bal-row .res.same{background:var(--water)} .bal-row .res.up{background:var(--bad)}
.donut{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
@media (max-width:420px){.donut{grid-template-columns:1fr;justify-items:center}}
.donut svg{width:150px;height:150px}
.donut ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;width:100%}
.donut li{display:flex;align-items:center;gap:8px;font-size:14px}
.donut li i{width:12px;height:12px;border-radius:3px;flex:none}
.points .donut li b{margin-left:auto;font-variant-numeric:tabular-nums}
.donut-extra{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.points .donut-extra span{font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:2px 10px;color:var(--ink)}
.bub{display:flex;flex-wrap:wrap;justify-content:center;padding:6px 0}
.bub div{width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:15px;line-height:1.3;margin:0 -6px;mix-blend-mode:multiply;color:var(--ink)}
:root[data-theme="dark"] .bub div{mix-blend-mode:normal}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bub div{mix-blend-mode:normal}}
.bub div:nth-child(6n+1){background:var(--water-soft)} .bub div:nth-child(6n+2){background:var(--leaf-soft)} .bub div:nth-child(6n+3){background:var(--sun-soft)}
.bub div:nth-child(6n+4){background:var(--bad-soft)} .bub div:nth-child(6n+5){background:var(--leaf-soft)} .bub div:nth-child(6n){background:var(--water-soft)}
.cloud{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.cloud span{border-radius:99px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;color:#fff;line-height:1.15;text-align:center}
.cloud span small{font-size:10px;font-weight:500;opacity:.9}
.cloud .v{background:var(--sun)} .cloud .m{background:var(--water)} .cloud .o{background:var(--leaf);color:var(--surface)}
.cloud .s1{width:62px;height:62px;font-size:13px} .cloud .s2{width:74px;height:74px;font-size:14px} .cloud .s3{width:54px;height:54px;font-size:12px}
.rb{display:flex;flex-direction:column;gap:10px}
.rb-base{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:12px;padding:10px}
.rb-base img{width:72px;height:72px;border-radius:10px;object-fit:cover}
.points .rb-base b{display:block;font-size:16px;color:var(--ink)} .points .rb-base span{font-family:var(--display);font-weight:900;font-size:22px;color:var(--sun)}
.rb-eq{text-align:center;font-weight:700;color:var(--muted);font-size:13px;letter-spacing:.1em}
.rb-items{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rb-it{background:var(--surface);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;border-bottom:4px solid var(--sun);min-width:0}
.rb-it img{width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;display:block;max-width:100%}
.rb-tx{padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.tmpl{display:flex;flex-direction:column;gap:12px;background:var(--leaf-soft);border-radius:14px;padding:16px}
.tmpl .eyebrow{color:var(--leaf)}
.tmpl h3{font-size:18px}

.chips div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.chips b{font-size:15px;color:var(--leaf)}

.split div{border-radius:10px;padding:12px 14px;min-width:0}
.split .good{background:var(--leaf-soft)} .split .bad{background:var(--bad-soft)}
.split h4{margin:0 0 6px;font-size:15px}
.split .good h4{color:var(--leaf)} .split .bad h4{color:var(--bad)}
.split ul{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:3px}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:20px 1fr;gap:12px;position:relative;padding-bottom:14px}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--leaf);margin:7px 0 0 4px;position:relative;z-index:1}
.tl li::after{content:"";position:absolute;left:9px;top:19px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl .h{font-weight:700;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.tl .h em{font-style:normal;font-size:12px;color:var(--sun);font-weight:700;font-variant-numeric:tabular-nums}
.tl .p{font-size:14px;color:var(--muted)}
.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}

.check input{margin-top:6px;accent-color:var(--leaf)}
.swatch{display:flex;flex-direction:column;gap:6px}
.sw{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;font-size:14px}
.sw i{height:26px;border-radius:6px;border:1px solid var(--line)}
.recap{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.recap div{font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:flex;gap:8px;min-width:0}
.recap em{font-style:normal;color:var(--sun);font-weight:700;font-variant-numeric:tabular-nums;flex:none}

.slides{display:flex;flex-direction:column;gap:14px}
.slide{margin:0;display:flex;flex-direction:column;gap:6px}
.slide button{padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;cursor:zoom-in;display:block;width:100%}
.slide img{display:block;width:100%;height:auto;aspect-ratio:16/9;max-width:100%}
.slide figcaption{font-size:13px;color:var(--muted)}

.myth .m .k{background:var(--bad)} .myth .f .k{background:var(--leaf)}

function T(s){ var r = s; if(LANG!=="zh"){ var e = I18N[s]; if(e){ r = e[LANG==="en"?0:1]; } } if(typeof COURSE_DAYS!=="undefined" && COURSE_DAYS!==21) r = r.replace(/\b21\b/g, String(COURSE_DAYS)); var a = arguments; return a.length>1 ? r.replace(/\{(\d)\}/g, function(m,i){ return a[+i+1]; }) : r; }
function DN(n){ return LANG==="zh" ? "第 "+n+" 天" : (LANG==="en" ? "Day " : "Hari ")+n; }
function langDate(y,m,d){ return LANG==="zh" ? y+"年"+m+"月"+d+"日" : d+" "+MONTHS[LANG][m-1]+" "+y; }
function langSwitchHTML(){ return '<div class="lang" role="group" aria-label="Language / 语言 / Bahasa">'+[["zh","中文"],["en","EN"],["ms","BM"]].map(function(x){ return '<button type="button" data-lang="'+x[0]+'" class="'+(LANG===x[0]?'on':'')+'" aria-pressed="'+(LANG===x[0])+'">'+x[1]+'</button>'; }).join("")+'</div>'; }
function applyStatic(){
  document.documentElement.lang = LANG==="zh" ? "zh" : LANG;
  document.querySelectorAll("[data-t]").forEach(function(el){ el.textContent = T(el.getAttribute("data-t")); });
  document.querySelectorAll("[data-t-aria]").forEach(function(el){ el.setAttribute("aria-label", T(el.getAttribute("data-t-aria"))); });
  document.querySelectorAll("[data-lang]").forEach(function(b){ var on = b.getAttribute("data-lang")===LANG; b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on)); });
  document.title = T("21天健康营养课");
}
function setLang(l){
  if(l===LANG) return; LANG = l; try{ localStorage.setItem("h21_lang", l); }catch(e){}
  applyStatic(); if(typeof window.onLangChange==="function") window.onLangChange();
}
document.addEventListener("click", function(e){ var b = e.target.closest && e.target.closest("[data-lang]"); if(b){ setLang(b.getAttribute("data-lang")); } });

/* ===== src/app/js-app/01-state-and-api.js ===== */
const API = "/api";
let TOKEN = null; try{ TOKEN = localStorage.getItem("h21_token"); }catch(e){}
let ADMIN = null; try{ ADMIN = localStorage.getItem("h21_admin"); }catch(e){}
const isPreview = new URLSearchParams(location.search).has("preview") && !!ADMIN;
const DAYS = Array.from({length:COURSE_DAYS},()=>({t:"",_full:false}));
let LIMIT = COURSE_DAYS; // last day this customer may read (set by the coach); never above this page's days
let done = {}, selected = null, preview = false, ME = null, SERVER_TODAY = null;
const pad = n => String(n).padStart(2,"0");
const today = () => SERVER_TODAY || new Date(Date.now()+8*3600e3).toISOString().slice(0,10);
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LOCK = '<svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="5.5" width="8" height="5.5" rx="1.2" fill="currentColor"/><path d="M4 5.5V4a2 2 0 0 1 4 0v1.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>';
async function api(path, opts={}){
  const tok = isPreview ? ADMIN : TOKEN;
  const r = await fetch(API+path, {method: opts.method||"GET", headers: Object.assign({"content-type":"application/json"}, tok?{authorization:"Bearer "+tok}:{}), body: opts.body?JSON.stringify(opts.body):undefined});
  let d = {}; try{ d = await r.json(); }catch(e){}
  if(!r.ok){ const e = new Error(T(d.error||"网络出错，请稍后再试")); e.status = r.status; e.code = d.code; throw e; }
  return d;
}
function isUnlocked(n){ if(n===1) return true; const prev = done[n-1]; return !!prev && today() > prev; }
function state(n){ if(n > LIMIT) return "locked"; if(done[n]) return "done"; if(isUnlocked(n)) return "today"; return "locked"; }
function nextDay(){ for(let n=1;n<=LIMIT;n++) if(!done[n]) return n; return null; }
function msToMidnight(){ const now = Date.now()+8*3600e3; const d = new Date(now); const m = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()+1); return m - now; }
function fmt(ms){ const s = Math.max(0,Math.floor(ms/1000)); return pad(Math.floor(s/3600))+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60); }

}

    const C=2*Math.PI*40; let off=0, arcs="";

    body = '<div class="bub">'+v.items.map(x=>'<div>'+esc(x)+'</div>').join("")+'</div>';

  } else if(v.type==="stack"){
    body = '<div class="stk-key">'+v.keys.map(([n,c])=>'<span><i style="background:'+c+'"></i>'+esc(n)+'</span>').join("")+'</div><div class="stk">'+
      v.rows.map(([n,vals])=>'<div class="stk-row"><span>'+esc(n)+'</span><div class="stk-bar">'+vals.map((x,j)=>'<i style="width:'+x+'%;background:'+v.keys[j][1]+'">'+(x>=12?x:'')+'</i>').join("")+'</div></div>').join("")+'</div>';
  } else if(v.type==="artery"){
    const plaque=[0,0.18,0.42,0.7];
    body = '<div class="art">'+v.stages.map((s,k)=>{ const r=34, inner=r-8, pl=plaque[k]*inner;
      return '<figure><svg viewBox="0 0 90 90" aria-hidden="true"><circle cx="45" cy="45" r="'+r+'" fill="var(--tissue)"/><circle cx="45" cy="45" r="'+inner+'" fill="var(--bad-soft)"/>'+
        (pl?'<path d="M'+(45-inner)+' 45 A'+inner+' '+inner+' 0 0 1 '+(45+inner)+' 45 Z" fill="#f2d16b" transform="rotate(200 45 45) translate(0 '+(inner-pl)*0.0+')" opacity=".95"/>':'')+
        '<circle cx="'+45+'" cy="'+(45-pl*0.55)+'" r="'+Math.max(3,inner-pl)+'" fill="var(--bad)"/></svg><figcaption>'+esc(s)+'</figcaption></figure>'; }).join("")+'</div>'+
      '<div class="art-key"><span><i style="background:var(--bad)"></i>'+T("血液流通的空间")+'</span><span><i style="background:#f2d16b"></i>'+T("脂肪斑块")+'</span></div>';

    const mx=Math.max(...v.items.map(x=>x[3]));

  } else if(v.type==="mealdays"){
    body = '<div class="md">'+v.days.map(d=>'<div class="md-day '+(d.hi?'hi':'lo')+'"><div class="md-h"><b>'+esc(d.h)+'</b><span>'+esc(d.total)+'</span></div><div class="md-meals">'+d.meals.map(([img,lab,k])=>'<div class="md-m">'+(img?'<img loading="lazy" src="fig/m_'+img+'.jpg" alt="" width="160" height="160">':'<i>'+T('不吃')+'</i>')+'<small>'+esc(lab)+'</small><em class="'+(parseInt(k)>=400?'hi':'')+'">'+esc(k)+'</em></div>').join("")+'</div></div>').join("")+'</div>';
  } else if(v.type==="cmp2"){
    body = '<div class="c2">'+v.rows.map(r=>'<div class="c2-row"><div class="c2-h">'+esc(r.h)+'</div><div class="c2-cols"><div class="c2-a"><small>'+esc(v.a)+'</small>'+r.a.map(x=>'<div><span>'+esc(x[0])+'</span><b>'+esc(x[1])+'</b></div>').join("")+'</div><div class="c2-b"><small>'+esc(v.b)+'</small><div><span>'+esc(r.b[0])+'</span><b>'+esc(r.b[1])+'</b></div></div></div></div>').join("")+'</div>';

    const tier = k=> k>=450?"hi":k>=200?"mid":"lo";
    body = '<div class="ct"><div class="ct-tabs" role="tablist">'+v.tabs.map((tb,i)=>'<button type="button" role="tab" class="ct-tab'+(i?'':' on')+'" data-ct="'+i+'" aria-selected="'+(i?'false':'true')+'">'+esc(tb.name)+'</button>').join("")+'</div>'+
      v.tabs.map((tb,i)=>'<div class="ct-panel" data-ctp="'+i+'"'+(i?' hidden':'')+'>'+tb.rows.map(([n,por,k])=>'<div class="ct-row"><div class="ct-name"><span>'+esc(n)+'</span><small>'+esc(por)+'</small></div><div class="ct-bar"><i class="'+tier(k)+'" style="width:'+Math.max(2,Math.min(100,k/700*100))+'%"></i></div><b class="ct-k '+tier(k)+'">'+k+'</b></div>').join("")+
      '<div class="ct-note">'+esc(tb.note)+'</div></div>').join("")+
      '<div class="ct-key"><span><i class="lo"></i>'+T("低于 200")+'</span><span><i class="mid"></i>200–449</span><span><i class="hi"></i>'+T("450 以上 kcal")+'</span></div></div>';

    body = '<div class="recap">'+DAYS.slice(0,20).map((d,i)=>'<div><em>'+(i+1)+'</em><span>'+esc(d.t)+'</span></div>').join("")+'</div>';
  }
  return '<div class="viz"><div class="viz-title">'+esc(v.title)+'</div>'+body+(v.note?'<div class="viz-note">'+esc(v.note)+'</div>':'')+'</div>';
}

  if(d.philo){ const ps=FIGSZ.philosophy||[867,598]; h += '<section class="philo"><div class="eyebrow">'+T('康宝莱均衡营养')+'</div><p>'+esc(d.philo)+'</p><button type="button" data-zoom="fig/philosophy.jpg" aria-label="'+T('放大查看：')+T('康宝莱均衡营养')+'"><img loading="lazy" src="fig/philosophy.jpg" alt="'+T('康宝莱均衡营养：30% 蛋白质、40% 醣类、30% 脂肪，加上纤维素、水分、睡眠和运动')+'" width="'+ps[0]+'" height="'+ps[1]+'"></button></section>'; }

/* ===== src/app/js-app/07-read-aloud.js ===== */
/* ---------- 听讲解 (speech synthesis) ---------- */
const TTS = { on:false, queue:[], idx:0, voice:null, rate:1 };
function ttsVoice(){
  if(!("speechSynthesis" in window)) return null;
  const vs = speechSynthesis.getVoices();
  const pick = l => vs.find(v=>v.lang && v.lang.replace("_","-").toLowerCase().startsWith(l));
  if(LANG==="en") return pick("en-gb") || pick("en-us") || pick("en-au") || pick("en") || null;
  if(LANG==="ms") return pick("ms-my") || pick("ms") || pick("id-id") || pick("id") || null;
  return pick("zh-cn") || pick("cmn") || pick("zh-sg") || pick("zh-tw") || pick("zh-hk") || pick("zh") || null;
}
if("speechSynthesis" in window){ speechSynthesis.onvoiceschanged = ()=>{ TTS.voice = ttsVoice(); }; TTS.voice = ttsVoice(); }
function ttsClean(s){
  if(LANG!=="zh"){ const en = LANG==="en";
    return String(s||"").replace(/≈/g, en?" about ":" kira-kira ").replace(/(\d)\s*[–-]\s*(\d)/g, en?"$1 to $2":"$1 hingga $2").replace(/kcal/gi, en?"calories":"kalori").replace(/g\/kg/gi, en?"grams per kilo":"gram sekilogram")
      .replace(/(\d)\s*g\b/g, en?"$1 grams":"$1 gram").replace(/(\d)\s*ml\b/gi, en?"$1 millilitres":"$1 mililiter").replace(/→/g,", ").replace(/\+/g, en?" plus ":" tambah ").replace(/×/g, en?" times ":" darab ").replace(/[“”"()·•]/g," ").replace(/\s+/g," ").trim(); }
  return String(s||"").replace(/≈/g,"约等于").replace(/(\d)\s*[–-]\s*(\d)/g,"$1到$2").replace(/kcal/gi,"卡路里").replace(/g\/kg/gi,"克每公斤")
    .replace(/(\d)\s*g\b/g,"$1克").replace(/→|＋|\+/g,"，").replace(/[「」“”《》（）()·•]/g," ").replace(/\s+/g," ").trim();
}
function ttsSplit(s){ const out=[]; String(s).split(/(?<=[。！？；!?;]|\.\s)/).forEach(x=>{ x=x.trim(); while(x.length>(LANG==="zh"?140:220)){ let k = LANG==="zh"?140:x.lastIndexOf(" ",220); if(k<60) k=220; out.push(x.slice(0,k)); x=x.slice(k).trim(); } if(x) out.push(x); }); return out; }
function ttsScript(n){
  const d = DAYS[n-1], q = QS[n-1], parts = [];
  const add = (text, pi) => ttsSplit(ttsClean(text)).forEach(s=>parts.push({s, pi}));
  const zh = LANG==="zh", P = zh?"。":". ", end = x => /[。！？.!?:：]$/.test(String(x).trim()) ? x : x+P;
  add(DN(n).replace(/ /g, zh?"":" ")+(zh?"，":". ")+end(d.t)); if(d.lead) add(d.lead); if(d.intro) add(d.intro);
  if(q && q.q) add(T("先想一想：")+q.q+T(" 想好了，可以在页面上选出你的答案。"));
  if(d.points){ add(end(T("今天要知道的 {0} 件事", d.points.length).replace(/ /g, zh?"":" "))); d.points.forEach((p,i)=>{ add(T("第{0}点，", i+1)+end(p.h), i); add(p.p, i); (p.list||[]).forEach(x=>add(end(x), i)); if(p.after) add(p.after, i); }); }
  if(d.fact) add(T("关键数字：")+d.fact.num+(d.fact.unit||"")+P+d.fact.text);
  if(d.myth) add(T("常见误区：")+d.myth.m+T(" 真相是：")+d.myth.f);
  if(d.tips && d.tips.length) add(T("实用小技巧：")+d.tips.join(zh?"；":"; ")+P);
  if(d.share) add(T("想一想：")+d.share);
  if(d.task) add(T("今日小任务：")+d.task);
  add(T("今天的讲解到这里，记得完成今日小任务。"));
  return parts;
}
function ttsMark(pi){ document.querySelectorAll(".points>li.reading").forEach(x=>x.classList.remove("reading")); if(pi!==undefined){ const li = document.querySelector('.points>li[data-pi="'+pi+'"]'); if(li) li.classList.add("reading"); } }
function ttsUI(){ const a=document.getElementById("ttsPlay"), b=document.getElementById("ttsStop"); if(!a) return; a.textContent = TTS.on ? (TTS.paused ? T("▶ 继续") : T("❚❚ 暂停")) : T("▶ 听讲解"); b.hidden = !TTS.on; }
// iPhone/Safari notes: speak() must start inside the tap; calling cancel() right before speak() can silently drop it;
// pause()/resume() are unreliable, so "pause" = stop and remember the sentence; keep a reference to the utterance so onend fires.
function ttsHush(){ try{ if(speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel(); }catch(e){} }
// iPhone Safari: speech always follows the Silent switch (tested; no web workaround). Chrome on iPhone is not affected.
const IOS_SAFARI = /iP(hone|ad|od)/.test(navigator.userAgent) && !/CriOS|FxiOS|EdgiOS|OPiOS/.test(navigator.userAgent);
function ttsStop(){ TTS.on = false; TTS.paused = false; TTS.queue = []; clearTimeout(TTS.watch); TTS.cur = null; ttsHush(); ttsMark(); ttsUI(); }
function ttsNext(){
  if(!TTS.on || TTS.paused) return;
  if(TTS.idx >= TTS.queue.length){ ttsStop(); const m=document.getElementById("ttsMsg"); if(m) m.textContent = T("讲解完毕"); return; }
  const c = TTS.queue[TTS.idx++]; ttsMark(c.pi);
  const u = new SpeechSynthesisUtterance(c.s); u.lang = (TTS.voice && TTS.voice.lang) || ({zh:"zh-CN",en:"en-GB",ms:"ms-MY"})[LANG]; if(TTS.voice) u.voice = TTS.voice; u.rate = TTS.rate;
  TTS.cur = u; TTS.started = false;
  u.onstart = ()=>{ TTS.started = true; clearTimeout(TTS.watch); const m=document.getElementById("ttsMsg"); if(m && m.dataset.hint) { m.textContent = ""; delete m.dataset.hint; } };
  u.onend = ()=>{ if(TTS.cur===u) ttsNext(); };
  u.onerror = e=>{ if(TTS.cur===u && e.error!=="interrupted" && e.error!=="canceled") ttsNext(); };
  speechSynthesis.speak(u);
  clearTimeout(TTS.watch);
  TTS.watch = setTimeout(()=>{ if(TTS.on && !TTS.paused && TTS.cur===u && !TTS.started && !speechSynthesis.speaking){ const m=document.getElementById("ttsMsg"); if(m){ m.textContent = T("没有声音？iPhone 请关掉静音模式（侧边静音键），或改用 Chrome 打开。"); m.dataset.hint = "1"; } } }, 2500);
}
function ttsBind(n){
  const a=document.getElementById("ttsPlay"); if(!a) return;
  const m=document.getElementById("ttsMsg"), r=document.getElementById("ttsRate");
  if(!("speechSynthesis" in window)){ a.disabled = true; m.textContent = T("这个浏览器不支持朗读"); return; }
  r.value = String(TTS.rate); r.onchange = ()=>{ TTS.rate = parseFloat(r.value); if(TTS.on && !TTS.paused){ TTS.idx = Math.max(0,TTS.idx-1); TTS.cur = null; ttsHush(); ttsNext(); } };
  a.onclick = ()=>{
    if(!TTS.on){ TTS.voice = ttsVoice(); m.textContent = TTS.voice ? "" : T("找不到中文语音，可能会用其他语言的声音朗读");
      TTS.on = true; TTS.paused = false; TTS.queue = ttsScript(n); TTS.idx = 0; TTS.cur = null; ttsHush(); ttsNext(); }
    else if(TTS.paused){ TTS.paused = false; TTS.idx = Math.max(0,TTS.idx-1); ttsNext(); }
    else { TTS.paused = true; TTS.cur = null; clearTimeout(TTS.watch); ttsHush(); }
    ttsUI();
  };
  document.getElementById("ttsStop").onclick = ttsStop;
  if(IOS_SAFARI && !m.textContent){ m.textContent = T("iPhone 用 Safari：请先关掉静音模式才有声音，或改用 Chrome 打开。"); m.dataset.ios = "1"; }
  ttsUI();
}

function statusScreen(u){ lastGate = ()=>statusScreen(u);
  const msg = {
    pending:['等待教练审核','你的注册已经收到。教练审核通过后，你就可以开始 21 天课程。'],
    rejected:['注册未通过','请联系你的教练了解详情。'],
    disabled:['账号已停用','请联系你的教练。'],
    renew_requested:['已申请重新开通','教练批准后，你就可以再次阅读课程内容。']
  };
  let h, p, extra = "";
  if(u.status==="approved" && u.expired){ h = "课程已结束"; p = "你已完成 21 天课程，回看期（完成后 7 天）已经结束。想再看一次，可以申请重新开通，教练批准后就能继续。"; extra = '<button class="btn" id="renew" type="button">'+T('申请重新开通')+'</button>'; }
  else { [h,p] = msg[u.status] || ['无法使用','请联系你的教练。']; }
  h = T(h); p = T(p);
  showGate('<div class="stbox"><h2>'+esc(h)+'</h2><p>'+esc(p)+'</p>'+extra+'<button class="linkbtn" id="refresh" type="button">'+T('重新检查')+'</button><button class="linkbtn" id="lo" type="button">'+T('登出（{0}）', esc(u.name))+'</button></div>');
  document.getElementById("refresh").onclick = boot; document.getElementById("lo").onclick = logout;
  const r = document.getElementById("renew"); if(r) r.onclick = async ()=>{ r.disabled = true; try{ await api("/renew",{method:"POST"}); boot(); }catch(e){ r.textContent = e.message; } };
}
function renderUbar(){
  const ub = document.getElementById("ubar");
  ub.innerHTML = (preview && !ME) ? '<span>'+T('管理员预览')+'</span><a class="linkbtn" href="/admin.html">'+T('返回管理后台')+'</a>'
    : '<span>'+esc(ME.name)+(ME.accessUntil?T(' · 可回看到 {0}', fmtDate(ME.accessUntil)):'')+'</span><button class="linkbtn" id="lo2" type="button">'+T('登出')+'</button>';
  const b = document.getElementById("lo2"); if(b) b.onclick = logout;
}

/* ===== src/app/js-app/11-start.js ===== */
// count one page open per load (for the admin statistics tab); the device id is random, not personal
let HIT_SENT = false;
function sendHit(){
  if(HIT_SENT) return; HIT_SENT = true;
  let dev = null; try{ dev = localStorage.getItem("h21_dev"); if(!dev){ dev = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem("h21_dev", dev); } }catch(e){}
  api("/hit",{method:"POST",body:{device:dev||"", lang:LANG}}).catch(()=>{});
}
// shortcut to the admin console on devices where the admin has logged in (shows how many are waiting)
async function adminShortcut(){
  if(isPreview) return;   // admin preview already has "返回管理后台" in the top bar
  let at = null; try{ at = localStorage.getItem("h21_admin"); }catch(e){}
  const old = document.getElementById("adminFab"); if(!at){ if(old) old.remove(); return; }
  try{
    const r = await fetch("/api/admin/users", {headers:{authorization:"Bearer "+at}}); if(!r.ok){ if(old) old.remove(); return; }
    const users = (await r.json()).users || [];
    const n = users.filter(u=>u.status==="pending" || u.status==="renew_requested").length;
    const a = old || Object.assign(document.createElement("a"), {id:"adminFab", href:"/admin.html", className:"admin-fab"});
    a.innerHTML = '管理后台' + (n ? ' <b>'+n+'</b>' : '');
    a.setAttribute("aria-label", "管理后台" + (n ? "，"+n+" 人待审核" : ""));
    if(!old) document.body.appendChild(a);
  }catch(e){}
}
async function boot(){
  sendHit(); adminShortcut();
  if(!TOKEN && !isPreview){ document.getElementById("wm").style.backgroundImage = ""; authForm("login"); return; }
  try{
    const d = await api("/me?lang="+LANG);
    SERVER_TODAY = d.today;
    d.titles.slice(0,COURSE_DAYS).forEach((t,i)=>{ DAYS[i].t = t; });
    // a customer opened the other course's link: send them to their own course
    // days 1–10 → the 10-day page, more → the 21-day page
    if(d.user){ const c = d.user.course||21, page = c<=10 ? 10 : 21; if(page!==COURSE_DAYS){ location.replace(page===10 ? "/10" : "/"); return; } LIMIT = Math.min(COURSE_DAYS, c); } else LIMIT = COURSE_DAYS;
    if(d.admin){ preview = true; done = {}; setWatermark("管理员预览"); }
    else {
      ME = d.user; done = d.done || {}; preview = !!ME.fullAccess;
      setWatermark(ME.name+" · "+ME.phone);
      if(ME.status!=="approved" || ME.expired){ statusScreen(ME); return; }
    }
    gate.hidden = true; app.hidden = false; renderUbar(); selected = null; renderAll();
  }catch(e){
    if(e.status===401){
      try{ localStorage.removeItem("h21_token"); }catch(_){} TOKEN = null;
      if(isPreview){ lastGate = null; showGate('<p>'+T('管理员登录已过期，请回到管理后台重新登录。')+'</p>'); return; }
      authForm("login", "登录已过期，或你的账号已在另一部设备登录。请重新登录。");
    } else { lastGate = null; showGate('<p class="note">'+esc(e.message)+'</p><button class="btn" id="rt" type="button">'+T('重试')+'</button>'); document.getElementById("rt").onclick = boot; }
  }
}
window.onLangChange = ()=>{ setWatermark(); DAYS.forEach(d=>{ d._full = false; }); if(!app.hidden){ renderAll(); renderUbar(); api("/me?lang="+LANG).then(d=>{ d.titles.slice(0,COURSE_DAYS).forEach((t,i)=>{ DAYS[i].t = t; }); renderAll(); }).catch(()=>boot()); } else if(lastGate) lastGate(); else boot(); };
document.getElementById("langTop").innerHTML = langSwitchHTML();
applyStatic();
let lastDay = today();
setInterval(()=>{
  if(app.hidden) return;
  const t = new Date(Date.now()+8*3600e3).toISOString().slice(0,10);
  if(t!==lastDay){ lastDay = t; SERVER_TODAY = t; selected = null; renderAll(); return; }
  document.querySelectorAll(".cd").forEach(x=> x.textContent = fmt(msToMidnight()));
}, 1000);
boot();
